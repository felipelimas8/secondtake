name: build

# A cada push no branch beta: roda os testes, gera o Second Take Beta e publica
# na pré-release "Beta (branch beta)" (tag móvel `beta-build`), sempre no mesmo link:
# https://github.com/<dono>/<repo>/releases/tag/beta-build
# (na main, este mesmo workflow publica a `main-build` da versão estável)
# Versões oficiais continuam saindo pelas tags v* (workflow release.yml).
# O job do Windows anexa o Setup.exe e o .zip portátil à mesma pré-release.

on:
  push:
    branches: [beta]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: beta-build
  cancel-in-progress: true

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: brew install ffmpeg create-dmg
      - run: python -m pip install -e ".[dev]" && python -m pytest -q
      - run: scripts/build_macos.sh
      - run: python scripts/make_samples.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: SecondTake-dmg-${{ github.sha }}
          path: dist/*.dmg
          retention-days: 14
      - name: Atualizar a pré-release "Beta (branch beta)"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python -c "import secondtake; print(secondtake.__version__)")
          SHORT=${GITHUB_SHA::7}
          gh release delete beta-build --yes --cleanup-tag 2>/dev/null || true
          gh release create beta-build dist/*.dmg dist/*.zip \
            --prerelease --target "$GITHUB_SHA" \
            --title "Beta (branch beta) · $VERSION · $SHORT" \
            --notes "Second Take Beta, gerado automaticamente a partir do commit $SHORT ($(date -u '+%Y-%m-%d %H:%M UTC')).
          Instala ao lado do Second Take normal, sem substituí-lo. Para a versão estável, veja a release Latest.

          Second Take Beta, built automatically from commit $SHORT. Installs alongside the regular Second Take. For the stable version, see the Latest release."

  windows:
    needs: dmg                # anexa à pré-release depois que o job do macOS a recria
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build
        shell: pwsh
        run: .\scripts\build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: SecondTake-windows-${{ github.sha }}
          path: |
            dist/SecondTake*-*-Windows-x64-Setup.exe
            dist/SecondTake*-*-Windows-x64-portatil.zip
          retention-days: 14
      - name: Anexar à pré-release "Beta (branch beta)"
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload beta-build (Get-ChildItem dist\SecondTake*-*-Windows-*).FullName --clobber
