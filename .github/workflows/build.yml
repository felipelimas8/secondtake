name: build

# A cada push na main: testes + app do macOS (.dmg/.zip) e do Windows (Setup.exe/portátil),
# cada um aberto de verdade por um teste de fumaça, e só então a pré-release móvel
# "Última versão (main)" (tag `main-build`) é recriada com todos os arquivos + SHA256SUMS.txt:
# https://github.com/<dono>/<repo>/releases/tag/main-build
# Se um dos dois sistemas falhar, a pré-release anterior fica como está (nada sai pela metade).
# Versões oficiais continuam saindo pelas tags v* (workflow release.yml).
#
# Dependências: requirements-build.txt (versões + hashes). Actions fixadas por SHA (tag no comentário).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-build
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: brew install ffmpeg create-dmg
      - run: python -m pip install --require-hashes -r requirements-build.txt && python -m pip install --no-deps -e .
      - run: python -m pytest -q
      - run: scripts/build_macos.sh
      - name: Teste de fumaça (app do .zip distribuído)
        run: |
          SMOKE=$(mktemp -d)
          ditto -x -k dist/SecondTake-*-macOS-*.zip "$SMOKE"
          python scripts/smoke_test.py "$SMOKE/Second Take.app/Contents/MacOS/Second Take"
      - run: python scripts/make_samples.py dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos
          path: dist/SecondTake-*
          retention-days: 14

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: python -m pip install --require-hashes -r requirements-build.txt && python -m pip install --no-deps -e .
      - run: python -m pytest -q
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build
        shell: pwsh
        run: .\scripts\build_windows.ps1
      - name: Teste de fumaça (app empacotado)
        run: python scripts/smoke_test.py "dist\Second Take\Second Take.exe"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows
          path: |
            dist/SecondTake-*-Windows-x64-Setup.exe
            dist/SecondTake-*-Windows-x64-portatil.zip
          retention-days: 14

  publish:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: SHA256SUMS.txt
        working-directory: dist
        run: |
          sha256sum SecondTake-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Recriar a pré-release "Última versão (main)"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n "s/^__version__ = '\(.*\)'/\1/p" src/secondtake/__init__.py)
          SHORT=${GITHUB_SHA::7}
          gh release delete main-build --yes --cleanup-tag 2>/dev/null || true
          gh release create main-build dist/SecondTake-* dist/SHA256SUMS.txt \
            --prerelease --target "$GITHUB_SHA" \
            --title "Última versão (main) · $VERSION · $SHORT" \
            --notes "Gerada automaticamente a partir do commit $SHORT ($(date -u '+%Y-%m-%d %H:%M UTC')).
          Para versões oficiais, veja as releases v*. Conferir os downloads: SHA256SUMS.txt.

          Built automatically from commit $SHORT. For official versions, see the v* releases. Verify downloads with SHA256SUMS.txt."
