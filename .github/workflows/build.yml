name: build

# A cada push na main: roda os testes, gera o app e o instalador .dmg e publica
# na pré-release "Última versão (main)" (tag móvel `main-build`), sempre no mesmo link:
# https://github.com/<dono>/<repo>/releases/tag/main-build
# Versões oficiais continuam saindo pelas tags v* (workflow release.yml).
# O job do Windows anexa o Setup.exe e o .zip portátil à mesma pré-release.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: main-build
  cancel-in-progress: true

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: brew install ffmpeg create-dmg
      - run: python -m pip install -e ".[dev]" && python -m pytest -q
      - run: scripts/build_macos.sh
      - run: python scripts/make_samples.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: SecondTake-dmg-${{ github.sha }}
          path: dist/*.dmg
          retention-days: 14
      - name: Atualizar a pré-release "Última versão (main)"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python -c "import secondtake; print(secondtake.__version__)")
          SHORT=${GITHUB_SHA::7}
          gh release delete main-build --yes --cleanup-tag 2>/dev/null || true
          gh release create main-build dist/*.dmg dist/*.zip \
            --prerelease --target "$GITHUB_SHA" \
            --title "Última versão (main) · $VERSION · $SHORT" \
            --notes "Gerada automaticamente a partir do commit $SHORT ($(date -u '+%Y-%m-%d %H:%M UTC')).
          Para versões oficiais, veja as releases v*.

          Built automatically from commit $SHORT. For official versions, see the v* releases."

  windows:
    needs: dmg                # anexa à pré-release depois que o job do macOS a recria
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build
        shell: pwsh
        run: .\scripts\build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: SecondTake-windows-${{ github.sha }}
          path: |
            dist/SecondTake-*-Windows-x64-Setup.exe
            dist/SecondTake-*-Windows-x64-portatil.zip
          retention-days: 14
      - name: Anexar à pré-release "Última versão (main)"
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload main-build (Get-ChildItem dist\SecondTake-*-Windows-*).FullName --clobber
