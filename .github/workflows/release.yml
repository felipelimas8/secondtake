name: release

# Tag v*: gera o app do macOS e do Windows, abre cada um com o teste de fumaça e só então
# publica a release com todos os arquivos + SHA256SUMS.txt. Se um dos sistemas falhar,
# nada é publicado (antes, a release saía como Latest só com os arquivos do Mac).
# Dependências: requirements-build.txt (versões + hashes). Actions fixadas por SHA (tag no comentário).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest   # Apple Silicon
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: brew install ffmpeg create-dmg
      - run: python -m pip install --require-hashes -r requirements-build.txt && python -m pip install --no-deps -e .
      - run: python -m pytest -q
      - run: scripts/build_macos.sh
      - name: Teste de fumaça (app do .zip distribuído)
        run: |
          SMOKE=$(mktemp -d)
          ditto -x -k dist/SecondTake-*-macOS-*.zip "$SMOKE"
          python scripts/smoke_test.py "$SMOKE/Second Take.app/Contents/MacOS/Second Take"
      - run: python scripts/make_samples.py dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos
          path: dist/SecondTake-*
          retention-days: 30

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: python -m pip install --require-hashes -r requirements-build.txt && python -m pip install --no-deps -e .
      - run: python -m pytest -q
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build
        shell: pwsh
        run: .\scripts\build_windows.ps1
      - name: Teste de fumaça (app empacotado)
        run: python scripts/smoke_test.py "dist\Second Take\Second Take.exe"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows
          path: |
            dist/SecondTake-*-Windows-x64-Setup.exe
            dist/SecondTake-*-Windows-x64-portatil.zip
          retention-days: 30

  publish:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: SHA256SUMS.txt
        working-directory: dist
        run: |
          sha256sum SecondTake-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            dist/SecondTake-*
            dist/SHA256SUMS.txt
          generate_release_notes: true
