name: tests

# Testes rápidos em Linux a cada push e pull request.
# O macOS roda os mesmos testes no workflow "build" (que também gera o .dmg),
# para não ocupar várias máquinas macOS por push.

on:
  push:
    branches: [main, beta]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg python3-tk
      - run: python -m pip install --require-hashes -r requirements-build.txt && python -m pip install --no-deps -e .
      - run: python -m pytest -v
